services:
  # Combined service (serves both API and static frontend)
  - type: web
    name: osint-tool
    runtime: node
    buildCommand: npm install --prefix server && npm install --prefix client && npm run build --prefix client
    startCommand: npm start --prefix server
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        value: "*"
    disk:
      name: osint-data
      mountPath: /var/data
      sizeGB: 1
